- name: Install PostgreSQL
  apt:
    name:
      - postgresql
      - postgresql-contrib
      - python3-psycopg2
    state: present
    update_cache: yes

- name: Start PostgreSQL cluster
  ansible.builtin.shell: |
    pg_ctlcluster 16 main start || true
  ignore_errors: yes

- name: Enable postgresql service
  ansible.builtin.shell: |
    systemctl enable postgresql@16-main
  ignore_errors: yes

- name: Create database and user with correct permissions
  ansible.builtin.shell: |
    sudo -u postgres psql -c "CREATE DATABASE studentapp;" || true
    sudo -u postgres psql -c "CREATE USER studentadmin WITH PASSWORD 'studentpass';" || true
    sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE studentapp TO studentadmin;" || true
    sudo -u postgres psql -d studentapp -c "GRANT ALL ON SCHEMA public TO studentadmin;" || true
    sudo -u postgres psql -d studentapp -c "ALTER SCHEMA public OWNER TO studentadmin;" || true
    sudo -u postgres psql -d studentapp -c "ALTER DATABASE studentapp OWNER TO studentadmin;" || true

- name: Allow remote connections in pg_hba.conf
  ansible.builtin.lineinfile:
    path: /etc/postgresql/16/main/pg_hba.conf
    line: "host    all             all             192.168.10.0/24         md5"
    state: present

- name: Listen on all interfaces
  ansible.builtin.lineinfile:
    path: /etc/postgresql/16/main/postgresql.conf
    regexp: "^#listen_addresses"
    line: "listen_addresses = '*'"

- name: Restart PostgreSQL cluster
  ansible.builtin.shell: |
    pg_ctlcluster 16 main restart
