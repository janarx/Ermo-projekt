<!DOCTYPE html>
<html>
<head><title>Student App</title></head>
<body>
    <h1>Sõnumid</h1>
    <form method="POST">
        <input type="text" name="username" placeholder="Sinu nimi" required><br><br>
        <textarea name="message" placeholder="Sõnum" required></textarea><br><br>
        <button type="submit">Saada</button>
    </form>
    <hr>
    {% for username, message in messages %}
        <p><b>{{ username }}</b>: {{ message }}</p>
    {% endfor %}
</body>
</html>
